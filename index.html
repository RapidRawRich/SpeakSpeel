<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Texas Instruments Speak & Spell (1978)</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c92c22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="Texas Instruments Speak & Spell (1978)">
  <meta property="og:description" content="Authentic 1978 Texas Instruments Speak & Spell emulation with 14-segment VFD, TMS5100 LPC speech synthesis, circuit bending, and all 5 original game modes.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/styles.css">
  <meta name="description" content="Authentic 1978 Texas Instruments Speak & Spell simulation with 14-segment VFD, TMS5100 LPC speech synthesis, circuit bending, and all 5 original game modes.">
</head>
<body>

  <main class="speak-spell-container" role="region" aria-label="Texas Instruments Speak and Spell 1978">
    
    <!-- Top Molded Carry Handle -->
    <div class="handle-outer" aria-hidden="true">
      <div class="handle-inner-cutout"></div>
    </div>

    <!-- Main Orange-Red Molded Body -->
    <div class="device-body">

      <!-- Header: Logo, Title & Perforated Speaker Grille -->
      <header class="device-header">
        <div class="brand-section">
          <div class="ti-logo-row">
            <div class="ti-emblem" aria-hidden="true">
              <div class="ti-emblem-inner"></div>
            </div>
            <span class="ti-name">Texas Instruments</span>
          </div>
          <div class="title-row">
            <h1 class="brand-title">Speak &amp; Spell</h1>
          </div>
          <div class="rainbow-stripe" aria-hidden="true"></div>
        </div>

        <!-- Speaker Grille -->
        <div class="speaker-grille" aria-label="Speaker Grille" role="img">
          <div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div>
          <div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div>
          <div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div>
          <div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div><div class="grille-hole"></div>
        </div>
      </header>

      <!-- 8-Character 14-Segment Vacuum Fluorescent Display (VFD) Section -->
      <section class="vfd-bezel" aria-label="Display Area">
        <div class="vfd-window" id="vfd-container" role="status" aria-live="polite">
          <!-- 14-segment characters generated dynamically by vfd.js -->
        </div>

        <!-- Level Indicator Badges -->
        <div class="level-indicator-bar">
          <span>DIFFICULTY MODULE</span>
          <div class="level-badges">
            <span class="level-badge active" id="badge-A">A</span>
            <span class="level-badge" id="badge-B">B</span>
            <span class="level-badge" id="badge-C">C</span>
            <span class="level-badge" id="badge-D">D</span>
          </div>
        </div>
      </section>

      <!-- 40-Key Membrane Keypad -->
      <section class="keypad-container" aria-label="Keypad">
        
        <!-- Row 1: Power & Game Modes -->
        <div class="keypad-row-modes">
          <button class="key key-on" data-key="ON" aria-label="Turn On">ON</button>
          <button class="key key-off" data-key="OFF" aria-label="Turn Off">OFF</button>
          <button class="key key-mode" data-key="SPELL" aria-label="Spell Mode">SPELL</button>
          <button class="key key-mode" data-key="MYSTERY" aria-label="Mystery Word Mode">MYSTERY<br>WORD</button>
          <button class="key key-mode" data-key="SAY_IT" aria-label="Say It Mode">SAY<br>IT</button>
          <button class="key key-mode" data-key="SECRET_CODE" aria-label="Secret Code Mode">SECRET<br>CODE</button>
          <button class="key key-mode" data-key="LETTER" aria-label="Letter Mode">LETTER</button>
          <button class="key key-module" data-key="MODULE" aria-label="Change Word Module Level">MODULE</button>
        </div>

        <!-- Letters Rows (A through Z, Apostrophe, and Action Keys) -->
        <div class="keypad-grid-letters">
          <!-- Row 2 -->
          <button class="key key-letter" data-key="A">A</button>
          <button class="key key-letter" data-key="B">B</button>
          <button class="key key-letter" data-key="C">C</button>
          <button class="key key-letter" data-key="D">D</button>
          <button class="key key-letter" data-key="E">E</button>
          <button class="key key-letter" data-key="F">F</button>
          <button class="key key-letter" data-key="G">G</button>
          <button class="key key-letter" data-key="H">H</button>

          <!-- Row 3 -->
          <button class="key key-letter" data-key="I">I</button>
          <button class="key key-letter" data-key="J">J</button>
          <button class="key key-letter" data-key="K">K</button>
          <button class="key key-letter" data-key="L">L</button>
          <button class="key key-letter" data-key="M">M</button>
          <button class="key key-letter" data-key="N">N</button>
          <button class="key key-letter" data-key="O">O</button>
          <button class="key key-letter" data-key="P">P</button>

          <!-- Row 4 -->
          <button class="key key-letter" data-key="Q">Q</button>
          <button class="key key-letter" data-key="R">R</button>
          <button class="key key-letter" data-key="S">S</button>
          <button class="key key-letter" data-key="T">T</button>
          <button class="key key-letter" data-key="U">U</button>
          <button class="key key-letter" data-key="V">V</button>
          <button class="key key-letter" data-key="W">W</button>
          <button class="key key-letter" data-key="X">X</button>

          <!-- Row 5 -->
          <button class="key key-letter" data-key="Y">Y</button>
          <button class="key key-letter" data-key="Z">Z</button>
          <button class="key key-letter" data-key="'" aria-label="Apostrophe">'</button>
          <button class="key key-action key-erase" data-key="ERASE" aria-label="Erase">ERASE</button>
          <button class="key key-action key-repeat" data-key="REPEAT" aria-label="Repeat">REPEAT</button>
          <button class="key key-action key-enter" data-key="ENTER" aria-label="Enter">ENTER</button>
          <button class="key key-module" data-key="LEVEL" aria-label="Level Select">LEVEL</button>
          <button class="key key-action key-repeat" data-key="DEMO" aria-label="Demo Voice">DEMO</button>
        </div>
      </section>

      <!-- Circuit Bending & Audio Parameters Drawer -->
      <section class="controls-drawer" aria-label="Audio Controls and Circuit Bending">
        <div class="control-group">
          <label class="control-label" for="bend-slider">
            <span>CIRCUIT BEND PITCH</span>
            <span class="bend-value" id="bend-display">1.00x</span>
          </label>
          <input type="range" id="bend-slider" class="slider" min="0.4" max="2.0" step="0.05" value="1.0" aria-label="Pitch Bender Slider">
        </div>

        <div class="control-group">
          <label class="control-label" for="volume-slider">
            <span>VOLUME</span>
            <span class="bend-value" id="vol-display">80%</span>
          </label>
          <input type="range" id="volume-slider" class="slider" min="0" max="1" step="0.05" value="0.8" aria-label="Volume Slider">
        </div>
      </section>

    </div>

    <!-- Instructions / Keyboard Shortcuts -->
    <p class="keyboard-help">
      Keyboard: Type letters <kbd>A</kbd>-<kbd>Z</kbd>, <kbd>Enter</kbd> = ENTER, <kbd>Backspace</kbd> = ERASE, <kbd>Space</kbd> = REPEAT.
    </p>

  </main>

  <!-- Core Scripts -->
  <script src="js/words.js"></script>
  <script src="js/vfd.js"></script>
  <script src="js/synth.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
